name: PayShield CD Cloud Staging Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Verification Agent Container
        run: docker build -f services/verification-agent/Dockerfile -t payshield/verification-agent:latest .

      - name: Build Web App Container
        run: docker build -f web-app/Dockerfile -t payshield/web-app:latest .
